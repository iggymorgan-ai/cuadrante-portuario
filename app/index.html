<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#1A1916"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Fichaje"/>
<link rel="apple-touch-icon" href="icon-180.png"/>
<link rel="icon" href="icon-192.png"/>
<title>Fichaje</title>
<script src="../config.js?v=1794592607"></script>
<style>
:root {
  --bg:#F5F4F0; --surface:#FFFFFF; --surface2:#EFEDE8; --border:#E0DDD6;
  --text:#1A1916; --text2:#6B6860; --text3:#9E9B94;
  --ok:#27500A; --ok-bg:#EAF3DE; --warn:#791F1F; --warn-bg:#FCEBEB;
  --in:#1E7B3A; --out:#B3261E;
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html,body { height:100%; overflow-x:hidden; }
body {
  font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;
  background:var(--bg); color:var(--text); font-size:15px; line-height:1.4;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  -webkit-tap-highlight-color:transparent;
}
button { font-family:inherit; }
.wrap { max-width:480px; margin:0 auto; padding:16px 16px 90px; }
header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.hello { font-size:13px; color:var(--text2); }
.name  { font-size:22px; font-weight:700; }
.clock { font-size:13px; color:var(--text2); text-align:right; font-variant-numeric:tabular-nums; }
.clock b { display:block; font-size:22px; color:var(--text); font-weight:600; }

.card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:12px; }
.card h2 { font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text3); margin-bottom:8px; }


.status { text-align:center; margin:6px 0 12px; font-size:14px; color:var(--text2); }
.status b { color:var(--text); }
.big-btn {
  width:100%; border:none; border-radius:18px; padding:26px 0; color:#fff;
  font-size:22px; font-weight:700; letter-spacing:.02em; cursor:pointer;
  box-shadow:0 6px 18px rgba(0,0,0,.15); transition:transform .08s, opacity .2s;
}
.big-btn:active { transform:scale(.98); }
.big-btn.in  { background:var(--in); }
.big-btn.out { background:var(--out); }
.big-btn:disabled { opacity:.5; }
.big-btn small { display:block; font-size:13px; font-weight:500; opacity:.85; margin-top:4px; }

.events { list-style:none; margin-top:12px; }
.events li { display:flex; justify-content:space-between; padding:7px 2px; border-top:1px solid var(--border); font-variant-numeric:tabular-nums; }
.events li:first-child { border-top:none; }
.dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:8px; }
.corr { font-size:11px; color:var(--text3); margin-left:6px; }

.muted { color:var(--text3); font-size:13px; }

.tabs { position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-top:1px solid var(--border);
  display:flex; padding:6px 0 calc(6px + env(safe-area-inset-bottom)); }
.tabs button { flex:1; min-width:0; border:none; background:none; padding:8px 0; font-size:12px; font-weight:600; color:var(--text3); }
.tabs button.active { color:var(--text); }
.tabs svg { display:block; width:22px; height:22px; margin:0 auto 2px; }

.month-nav { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.month-nav button { border:1px solid var(--border); background:var(--surface); border-radius:8px; padding:6px 12px; font-size:16px; }
.month-nav b { font-size:15px; }
.hist-day { padding:9px 2px; border-top:1px solid var(--border); }
.hist-day:first-child { border-top:none; }
.hist-head { display:flex; justify-content:space-between; font-weight:600; font-size:14px; }
.hist-times { font-size:13px; color:var(--text2); font-variant-numeric:tabular-nums; margin-top:2px; }
.total { display:flex; justify-content:space-between; font-weight:700; padding-top:10px; margin-top:6px; border-top:2px solid var(--text); }

.msg { padding:12px; border-radius:10px; font-size:14px; margin-bottom:12px; }
.msg.err { background:var(--warn-bg); color:var(--warn); }
.msg.ok  { background:var(--ok-bg); color:var(--ok); }
.install { background:#1A1916; color:#fff; border-radius:12px; padding:12px 14px; font-size:13px; margin-bottom:12px; }
.install button { margin-top:8px; border:none; border-radius:8px; padding:7px 12px; font-weight:600; background:#fff; color:#1A1916; }
.center { text-align:center; padding:40px 10px; }
.center h1 { font-size:20px; margin-bottom:8px; }
.center p { color:var(--text2); font-size:14px; }
.center input { width:100%; margin-top:14px; padding:12px; border:1px solid var(--border); border-radius:10px; font-size:14px; }
.center button { margin-top:10px; width:100%; padding:12px; border:none; border-radius:10px; background:var(--text); color:#fff; font-weight:600; font-size:15px; }
.hidden { display:none !important; }
.wk-day { padding:9px 0; border-top:1px solid var(--border); }
.wk-day:first-child { border-top:none; }
.wk-day.hoy { background:#FBF8EE; margin:0 -14px; padding:9px 14px; }
.wk-head { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
.wk-head b { min-width:0; }
.wk-head b { font-size:14px; }
.yo { white-space:nowrap; flex-shrink:0; font-size:13px; font-weight:700; padding:2px 8px; border-radius:10px; background:var(--text); color:#fff; }
.yo.libre { background:var(--surface2); color:var(--text2); }
.yo.vac { background:#E6F1F8; color:#1F5E85; }
.wk-zone { font-size:12px; color:var(--text2); margin-top:3px; }
.wk-zone span { color:var(--text3); font-weight:600; margin-right:4px; }
.wk-zone i { font-style:normal; font-weight:700; color:var(--text); }
.per { display:flex; justify-content:space-between; padding:7px 0; border-top:1px solid var(--border); font-size:14px; }
.per:first-child { border-top:none; }
</style>
</head>
<body>
<div class="wrap" id="root"><div class="center"><p>Cargando…</p></div></div>

<nav class="tabs hidden" id="tabs">
  <button class="active" data-tab="hoy" onclick="go('hoy')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>Fichar</button>
  <button data-tab="historial" onclick="go('historial')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Mis horas</button>
  <button data-tab="cuadrante" onclick="go('cuadrante')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Cuadrante</button>
  <button data-tab="vacaciones" onclick="go('vacaciones')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18M5 8c2-3 12-3 14 0M7 21h10"/></svg>Vacaciones</button>
</nav>

<script>
'use strict';
const DS   = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const DF   = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const MON  = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const LS_TOKEN = 'fichaje_token';

// ── Token: del enlace (?t=…) o del almacenamiento ──
const urlTok = new URLSearchParams(location.search).get('t');
if (urlTok) localStorage.setItem(LS_TOKEN, urlTok);
let TOKEN = urlTok || localStorage.getItem(LS_TOKEN);

// Manifest dinámico: así la app instalada arranca ya con el token en la URL
// (en iPhone la app instalada no comparte almacenamiento con Safari).
(function manifest() {
  const base = location.origin + location.pathname;
  const m = {
    name: CFG.NOMBRE_APP || 'Fichaje', short_name: CFG.NOMBRE_APP || 'Fichaje',
    start_url: TOKEN ? `${base}?t=${encodeURIComponent(TOKEN)}` : base,
    scope: base.replace(/[^/]*$/, ''), display: 'standalone',
    background_color: '#F5F4F0', theme_color: '#1A1916',
    icons: [192, 512].map(s => ({ src: new URL(`icon-${s}.png`, base).href, sizes: `${s}x${s}`, type: 'image/png', purpose: 'any maskable' })),
  };
  const l = document.createElement('link');
  l.rel = 'manifest';
  l.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(m));
  document.head.appendChild(l);
})();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

// ── API (funciones de Supabase, sin librería) ──
async function rpc(fn, args) {
  const r = await fetch(`${CFG.SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method: 'POST',
    headers: { apikey: CFG.SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },   // vale para claves sb_publishable_ y anon
    body: JSON.stringify(args),
  });
  const j = await r.json().catch(() => null);
  if (!r.ok) throw new Error((j && (j.message || j.hint)) || `Error ${r.status}`);
  return j;
}

// ── Fechas ──
const pad  = n => String(n).padStart(2, '0');
const hm   = iso => { const d = new Date(iso); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const ymd  = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
function dur(ms) { const m = Math.round(ms / 60000); return `${Math.floor(m / 60)} h ${pad(m % 60)} min`; }

// Empareja entrada→salida y devuelve tramos {in, out}
function tramos(evs) {
  const out = []; let open = null;
  evs.forEach(e => {
    if (e.tipo === 'entrada') { if (open) out.push({ in: open, out: null }); open = e.ts; }
    else if (e.tipo === 'salida') { out.push({ in: open, out: e.ts }); open = null; }
  });
  if (open) out.push({ in: open, out: null });
  return out;
}

// ── Estado de la vista ──
let ST = null, tab = 'hoy', busy = false, msg = null, histMonth = new Date();
const root = document.getElementById('root');

function go(t) {
  tab = t;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
  render();
}

async function boot() {
  if (!CFG.SUPABASE_URL) { root.innerHTML = `<div class="center"><h1>Falta configurar</h1><p>Rellena config.js con los datos de Supabase.</p></div>`; return; }
  if (!TOKEN) return showNoToken();
  try {
    ST = await rpc('mi_estado', { p_token: TOKEN });
    document.getElementById('tabs').classList.remove('hidden');
    render();
  } catch (e) {
    if (/Enlace no válido/.test(e.message)) { localStorage.removeItem(LS_TOKEN); TOKEN = null; return showNoToken('Tu enlace ya no es válido. Pide uno nuevo.'); }
    root.innerHTML = `<div class="center"><h1>Sin conexión</h1><p>${e.message}</p><button onclick="boot()">Reintentar</button></div>`;
  }
}

function showNoToken(err) {
  document.getElementById('tabs').classList.add('hidden');
  root.innerHTML = `<div class="center">
    <h1>Abre tu enlace personal</h1>
    <p>${err || 'Tu encargado te ha enviado un enlace (o un código QR). Ábrelo desde este móvil.'}</p>
    <input id="paste" placeholder="…o pega aquí el enlace"/>
    <button onclick="pasteLink()">Entrar</button></div>`;
}
function pasteLink() {
  const v = document.getElementById('paste').value.trim();
  const m = v.match(/[?&]t=([a-f0-9]+)/i) || v.match(/^([a-f0-9]{32,})$/i);
  if (!m) return alert('Ese enlace no parece correcto.');
  location.href = `${location.pathname}?t=${m[1]}`;
}

async function doFichar() {
  if (busy) return;
  const vaASalir = ST.dentro;
  if (vaASalir && !confirm('¿Registrar tu SALIDA ahora?')) return;
  busy = true; render();
  try {
    ST = await rpc('fichar', { p_token: TOKEN });
    msg = { ok: true, t: `${ST.dentro ? 'Entrada' : 'Salida'} registrada a las ${hm(ST.ultimo)}` };
    if (navigator.vibrate) navigator.vibrate(60);
  } catch (e) { msg = { ok: false, t: e.message }; }
  busy = false; render();
  setTimeout(() => { msg = null; render(); }, 4000);
}

function render() {
  if (!ST) return;
  if (tab === 'hoy') return renderHoy();
  if (tab === 'historial') return renderHistorial();
  if (tab === 'cuadrante') return renderCuadrante();
  if (tab === 'vacaciones') return renderVacaciones();
}

// ══ Cuadrante y vacaciones: SOLO LECTURA (el encargado decide qué semanas publica al guardarlas) ══
let CQ = null, cqWeek = 0;
async function cargarCQ() {
  if (CQ) return CQ;
  root.innerHTML = `<div class="card"><span class="muted">Cargando…</span></div>`;
  try { CQ = await rpc('mi_cuadrante', { p_token: TOKEN }); }
  catch (e) { root.innerHTML = `<div class="msg err">${/mi_cuadrante/.test(e.message) ? 'El cuadrante aún no está disponible. Avisa a tu encargado.' : e.message}</div>`; return null; }
  return CQ;
}
const dk = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
// La clave de cada semana puede venir con la fecha del domingo anterior o del lunes: se normaliza al lunes.
function lunesDe(k) { const d = new Date(k + 'T12:00:00'); if (d.getDay() === 0) d.setDate(d.getDate() + 1); d.setHours(0, 0, 0, 0); return d; }
function sedeCfg() { return (CFG.SEDES && CFG.SEDES[CQ.sede]) || { terminales: [{ k: 'MSC', l: 'MSC' }, { k: 'TE', l: 'Terminal E' }, { k: 'TD', l: 'Terminal D' }], bar: true }; }
function zonas() {
  const S = sedeCfg(), out = [];
  S.terminales.forEach(t => out.push({ key: t.k, l: t.l }));
  if (S.bar) S.terminales.forEach(t => out.push({ key: 'Bar' + t.k, l: `${S.barNombre || 'Bar'}${S.terminales.length > 1 ? ' ' + (t.s || t.l) : ''}` }));
  return out;
}
async function renderCuadrante() {
  if (!(await cargarCQ()) || tab !== 'cuadrante') return;
  const wks = Object.keys(CQ.semanas).map(k => ({ k, mon: lunesDe(k) })).sort((a, b) => a.mon - b.mon);
  if (!wks.length) { root.innerHTML = `<div class="card"><h2>Cuadrante</h2><span class="muted">Todavía no hay ninguna semana publicada.</span></div>`; return; }
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  if (cqWeek === null || cqWeek >= wks.length) cqWeek = 0;
  if (!renderCuadrante.init) { renderCuadrante.init = 1; const i = wks.findIndex(w => hoy - w.mon < 7 * 864e5 && hoy >= w.mon); cqWeek = i >= 0 ? i : wks.findIndex(w => w.mon > hoy); if (cqWeek < 0) cqWeek = wks.length - 1; }
  const W = wks[cqWeek], wd = CQ.semanas[W.k], yo = CQ.nombre, Z = zonas();
  const fin = new Date(W.mon); fin.setDate(fin.getDate() + 6);
  let h = `<div class="month-nav"><button ${cqWeek ? '' : 'disabled style="opacity:.3"'} onclick="cqWeek--;render()">‹</button>
    <b>${W.mon.getDate()}/${W.mon.getMonth() + 1} – ${fin.getDate()}/${fin.getMonth() + 1}</b>
    <button ${cqWeek < wks.length - 1 ? '' : 'disabled style="opacity:.3"'} onclick="cqWeek++;render()">›</button></div><div class="card">`;
  for (let d = 0; d < 7; d++) {
    const f = new Date(W.mon); f.setDate(f.getDate() + d);
    const dd = (wd.days && wd.days[d]) || { assign: {}, fiestas: {}, barcos: {} }, k = dk(f);
    const mia = Z.find(z => (dd.assign[z.key] || []).includes(yo));
    const vacYo = CQ.vac[yo] && CQ.vac[yo][k];
    const ofis = d < 5 && !CQ.festivos[k] ? (CQ.oficina || []).filter(n => !(CQ.vac[n] && CQ.vac[n][k])) : [];
    const etiqueta = vacYo ? `<span class="yo vac">🌴 Vacaciones</span>` : ofis.includes(yo) ? `<span class="yo">Administración</span>` : mia ? `<span class="yo">${mia.l}</span>` : `<span class="yo libre">${dd.fiestas && dd.fiestas[yo] ? 'Fiesta' : 'Libre'}</span>`;
    const lista = Z.filter(z => (dd.assign[z.key] || []).length).map(z => {
      const barco = dd.barcos && dd.barcos[z.key] ? ` · ${dd.barcos[z.key]}` : '';
      return `<div class="wk-zone"><span>${z.l}${barco}</span>${dd.assign[z.key].map(n => n === yo ? `<i>${n}</i>` : n).join(', ')}</div>`; }).join('');
    const vacs = CQ.nombres.filter(n => CQ.vac[n] && CQ.vac[n][k]);
    h += `<div class="wk-day${+f === +hoy ? ' hoy' : ''}"><div class="wk-head"><b>${DF[d]} ${f.getDate()}${CQ.festivos[k] ? ` <span class="muted">· ${CQ.festivos[k]}</span>` : ''}</b>${etiqueta}</div>
      ${lista || '<div class="wk-zone">Sin barcos</div>'}${ofis.length ? `<div class="wk-zone"><span>Administración</span>${ofis.map(n => n === yo ? `<i>${n}</i>` : n).join(', ')}</div>` : ''}${vacs.length ? `<div class="wk-zone"><span>🌴</span>${vacs.join(', ')}</div>` : ''}</div>`;
  }
  root.innerHTML = h + `</div><p class="muted" style="text-align:center">Solo para consultar. Los cambios los hace tu encargado.</p>`;
}
function tramosFechas(fs) {
  const out = [];
  fs.forEach(k => { const d = new Date(k + 'T12:00:00'), u = out[out.length - 1];
    if (u && (d - u.bd) / 864e5 <= 1.01) { u.b = k; u.bd = d; u.n++; } else out.push({ a: k, b: k, bd: d, n: 1 }); });
  return out;
}
const fc = k => { const d = new Date(k + 'T12:00:00'); return `${d.getDate()} ${MON[d.getMonth()].slice(0, 3).toLowerCase()}`; };
async function renderVacaciones() {
  if (!(await cargarCQ()) || tab !== 'vacaciones') return;
  const yo = CQ.nombre, hoyK = dk(new Date());
  const ICO = { 1: '🌴 Vacaciones', F: '🎉 Festivo compensado', H: '⏱ Horas compensadas' };
  const mias = Object.keys(CQ.vac[yo] || {}).filter(k => k >= hoyK.slice(0, 4) - 1 + hoyK.slice(4)).sort();
  const lista = t => tramosFechas(mias.filter(k => String(CQ.vac[yo][k]) === t)).map(p =>
    `<div class="per"><span>${p.n > 1 ? `${fc(p.a)} → ${fc(p.b)}` : fc(p.a)}${p.b < hoyK ? ' <span class="muted">(pasadas)</span>' : ''}</span><b>${p.n} día${p.n > 1 ? 's' : ''}</b></div>`).join('');
  let h = `<div class="card"><h2>Mis días libres</h2>`;
  const bloques = ['1', 'F', 'H'].map(t => { const x = lista(t); return x ? `<div class="muted" style="margin:6px 0 2px">${ICO[t]}</div>${x}` : ''; }).join('');
  h += (bloques || '<span class="muted">No tienes días programados.</span>') + `</div>`;
  // Equipo: próximos periodos de todos (para saber quién falta)
  const prox = [];
  CQ.nombres.forEach(n => tramosFechas(Object.keys(CQ.vac[n] || {}).filter(k => k >= hoyK).sort()).forEach(p => prox.push({ quien: n, a: p.a, b: p.b, dias: p.n })));
  prox.sort((a, b) => a.a.localeCompare(b.a));
  h += `<div class="card"><h2>Próximas del equipo</h2>${prox.length ? prox.slice(0, 40).map(p =>
    `<div class="per"><span>${p.quien === yo ? `<b>${p.quien}</b>` : p.quien}</span><span class="muted">${p.dias > 1 ? `${fc(p.a)} → ${fc(p.b)}` : fc(p.a)}</span></div>`).join('') : '<span class="muted">Nadie tiene vacaciones programadas.</span>'}</div>
    <p class="muted" style="text-align:center">Si algo no cuadra, díselo a tu encargado.</p>`;
  root.innerHTML = h;
}

function installHint() {
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (standalone || localStorage.getItem('fichaje_hint_off')) return '';
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  return `<div class="install">📲 <b>Instala la app</b> para tenerla en tu pantalla de inicio:<br>
    ${ios ? 'pulsa <b>Compartir</b> (el cuadrado con flecha) → <b>Añadir a pantalla de inicio</b>.' : 'abre el menú <b>⋮</b> del navegador → <b>Instalar app</b> o <b>Añadir a pantalla de inicio</b>.'}
    <br><button onclick="localStorage.setItem('fichaje_hint_off',1);render()">Ya está</button></div>`;
}

function renderHoy() {
  const now  = new Date();
  const d    = (now.getDay() || 7) - 1;
  const hoy  = ST.hoy || [];
  const trs  = tramos(hoy);
  const tot  = trs.reduce((a, t) => a + ((t.out ? new Date(t.out) : now) - new Date(t.in || now)), 0);

  root.innerHTML = `
    <header>
      <div><div class="hello">Hola,</div><div class="name">${ST.nombre}</div></div>
      <div class="clock">${DF[d]} ${now.getDate()} ${MON[now.getMonth()].toLowerCase()}<b id="clk">${pad(now.getHours())}:${pad(now.getMinutes())}</b></div>
    </header>
    ${installHint()}
    ${msg ? `<div class="msg ${msg.ok ? 'ok' : 'err'}">${msg.t}</div>` : ''}
    ${ST.olvido ? `<div class="msg err">⚠️ No fichaste la salida del ${new Date(ST.olvido).toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric' })} (entraste a las ${hm(ST.olvido)}). Avisa a tu encargado para que la corrija.</div>` : ''}
    <div class="card">
      <div class="status">${ST.dentro ? `Estás <b>dentro</b> desde las <b>${hm(ST.ultimo)}</b>` : 'Estás <b>fuera</b>'}</div>
      <button class="big-btn ${ST.dentro ? 'out' : 'in'}" onclick="doFichar()" ${busy ? 'disabled' : ''}>
        ${busy ? 'Registrando…' : ST.dentro ? 'FICHAR SALIDA' : 'FICHAR ENTRADA'}
        <small>${ST.dentro ? 'Al terminar tu jornada' : 'Al empezar tu jornada'}</small>
      </button>
      ${hoy.length ? `<ul class="events">${hoy.map(e => `<li><span><span class="dot" style="background:${e.tipo === 'entrada' ? 'var(--in)' : 'var(--out)'}"></span>${e.tipo === 'entrada' ? 'Entrada' : 'Salida'}${e.origen === 'correccion' ? '<span class="corr">(corregido)</span>' : ''}</span><b>${hm(e.ts)}</b></li>`).join('')}
        <li><span>Total hoy</span><b>${dur(tot)}</b></li></ul>` : ''}
    </div>`;
}

let histCache = {};
async function renderHistorial() {
  const y = histMonth.getFullYear(), m = histMonth.getMonth();
  const key = `${y}-${m}`;
  const head = `<div class="month-nav"><button onclick="histMonth=new Date(${y},${m - 1},1);render()">‹</button>
      <b>${MON[m]} ${y}</b><button onclick="histMonth=new Date(${y},${m + 1},1);render()">›</button></div>`;
  if (!histCache[key]) {
    root.innerHTML = head + `<div class="card"><span class="muted">Cargando…</span></div>`;
    try { histCache[key] = await rpc('mi_historial', { p_token: TOKEN, p_desde: ymd(new Date(y, m, 1)), p_hasta: ymd(new Date(y, m + 1, 0)) }); }
    catch (e) { root.innerHTML = head + `<div class="msg err">${e.message}</div>`; return; }
    if (tab !== 'historial') return;
  }
  const evs = histCache[key];
  const porDia = {};
  tramos(evs).forEach(t => { const k = ymd(new Date(t.in || t.out)); (porDia[k] = porDia[k] || []).push(t); });
  let total = 0;
  const dias = Object.keys(porDia).sort().reverse().map(k => {
    const trs = porDia[k];
    const ms  = trs.reduce((a, t) => a + (t.in && t.out ? new Date(t.out) - new Date(t.in) : 0), 0);
    total += ms;
    const dt = new Date(k + 'T12:00:00');
    return `<div class="hist-day"><div class="hist-head"><span>${DS[(dt.getDay() || 7) - 1]} ${dt.getDate()}</span><span>${dur(ms)}</span></div>
      <div class="hist-times">${trs.map(t => `${t.in ? hm(t.in) : '¿?'} → ${t.out ? hm(t.out) : '<i>sin salida</i>'}`).join(' · ')}</div></div>`;
  }).join('');
  root.innerHTML = head + `<div class="card"><h2>Mis horas</h2>
    ${dias || '<span class="muted">Sin fichajes este mes.</span>'}
    ${dias ? `<div class="total"><span>Total del mes</span><span>${dur(total)}</span></div>` : ''}</div>
    <p class="muted" style="text-align:center">Si ves un error en tus horas, díselo a tu encargado para que lo corrija.</p>`;
}

// Reloj y refresco al volver a la app
setInterval(() => { const c = document.getElementById('clk'); if (c) { const n = new Date(); c.textContent = `${pad(n.getHours())}:${pad(n.getMinutes())}`; } }, 15000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && TOKEN && ST) { histCache = {}; CQ = null; boot(); } });

boot();
</script>
